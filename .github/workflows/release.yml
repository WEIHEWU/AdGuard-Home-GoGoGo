name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unified Flashable Package
        run: |
          case "${GITHUB_REF_NAME:-}" in
            v*) VERSION_TAG="$GITHUB_REF_NAME" ;;
            *)  VERSION_TAG="v20261116.2-rc.3" ;;
          esac
          VERSION_DATE="${VERSION_TAG#v}"
          case "$VERSION_TAG" in
            *-rc*|*beta*|*candidate*) IS_PRERELEASE="true"; MAKE_LATEST="false" ;;
            *)                       IS_PRERELEASE="false"; MAKE_LATEST="true" ;;
          esac
          chmod +x ./build.sh
          ./build.sh "$VERSION_DATE"
          cp -f module/AdGuardHomeManager.apk releases/AdGuardHomeManager.apk
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "VERSION_DATE=$VERSION_DATE" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "AdGuard Home GoGoGo ${{ env.VERSION_TAG }} (False-Positive Diagnostics & Debug Bundle Edition)"
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          body: |
            ### 🚀 AdGuard Home GoGoGo `${{ env.VERSION_TAG }}` (Candidate / Pre-release)

            基于既有满血 DNS + SNI (`443`/`8443`) 双链架构（100% 保持全部过滤订阅、默认规则、DNS 上游与 SNI 检查范围不变），集成 **[AdGuard-Home-GoGoGo-Core v2026-11-16-rc.3](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Core)** 与 **[AdGuard-Home-GoGoGo-Manager v2.24.24-rc.1](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Manager)**：

            > ⚠️ Candidate pre-release: Core race/unit/android_slim (Linux ARM64) tests, Manager static analysis & 35 unit/widget/HTTP mock tests, and module shell sandbox regression suite (TEST 1-9) all passed; real-device interactive testing on Android is pending.

            1. **🔍 Core + Manager 误杀排错补修升级 (`rc.2`)**:
               - 核心新增 `/control/filtering/set_rules` 原子 `expected_revision` 条件更新与 `409` 并发冲突保护，并补齐 `android_slim` 下 `querylog`/`snifilter` 实测覆盖（含 `FilteredSNI`、`blocked_summary` 容量/过期/匿名化与隐私策略）；
               - 管理器内置完整版本化离线 PSL（ICANN + PRIVATE + 通配 + 例外规则，未知后缀禁用宽范围放行），严格分项核验写后 `A` / `AAAA` 与缓存刷新结果，统一跨入口服务器共享写队列并支持可核验撤销归属防误删；
               - 继续保留拦截摘要、最近拦截同秒聚合、两级安全加白与 `$important` 识别。
            2. **🧰 模块调试日志开关与一键诊断包 (`diag_log.sh` / 管理器诊断页)**:
               - 默认关闭、按分钟自动过期、采用独立日志锁先行开档的短事务轮转日志；
               - 管理器一键导出全链路脱敏（含日志前缀/续行凭据、超时部分保留与子进程完整回收）诊断 ZIP 并调用系统分享。
            3. **⏱️ 模式切换阶段单调计时与等效自检补修 (`switch_mode.sh` / `service.sh` / `iptables.sh`)**:
               - 父 Shell 统一初始化单调时钟并在子脚本继承，消除重复配置校验，并在单次 `post_apply_check` 完整核对 `443`/`8443` NFQUEUE、`--queue-bypass` 与核心 GID `23333` 豁免。
          files: |
            releases/AdGuard_Home_gogogo_${{ env.VERSION_DATE }}.zip
            releases/AdGuardHomeManager.apk
