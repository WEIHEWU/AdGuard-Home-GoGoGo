name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unified Flashable Package
        run: |
          case "${GITHUB_REF_NAME:-}" in
            v*) VERSION_TAG="$GITHUB_REF_NAME" ;;
            *)  VERSION_TAG="v20261117.2" ;;
          esac
          VERSION_DATE="${VERSION_TAG#v}"
          case "$VERSION_TAG" in
            *-rc*|*beta*|*candidate*) IS_PRERELEASE="true"; MAKE_LATEST="false" ;;
            *)                       IS_PRERELEASE="false"; MAKE_LATEST="true" ;;
          esac
          chmod +x ./build.sh
          ./build.sh "$VERSION_DATE"
          cp -f module/AdGuardHomeManager.apk releases/AdGuardHomeManager.apk
          (
            cd releases
            sha256sum "AdGuard_Home_gogogo_${VERSION_DATE}.zip" "AdGuardHomeManager.apk" > SHA256SUMS.txt
            sha256sum "../module/bin/AdGuardHome" | sed 's|\.\./module/||' >> SHA256SUMS.txt
          )
          cat releases/SHA256SUMS.txt
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "VERSION_DATE=$VERSION_DATE" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "AdGuard Home GoGoGo ${{ env.VERSION_TAG }}"
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          body: |
            ### AdGuard Home GoGoGo `${{ env.VERSION_TAG }}`

            基于 `v20261117.1` / `v20261117.2-rc.1` 基线发布正式版，内置 **[AdGuard-Home-GoGoGo-Core v2026-11-16-rc.3](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Core)** 与 **[AdGuard-Home-GoGoGo-Manager v2.24.27](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Manager)**：

            > ⚠️ **验证与实机状态说明**：Core 二进制（`c5e38874ab9a413b5f5e668301058e46ed1e258ce83dc73c380c79d529201f3a`）与模块脚本未变更；Manager 静态分析、48 项单元与 Widget 测试、APK 签名及刷机包体核验已通过。本端环境未连接实机（`adb devices -l` 为空），自候选版以来的真机视觉与端到端交互验收尚未在实机执行。

            #### 小范围修复说明
            修复日志页面开启“聚合重复”后，重复条目右侧缺少状态图标与文字的问题。聚合日志与普通日志现在统一显示实际处理状态，并保留查看详情的箭头。Core、规则和过滤策略保持不变。

            #### 升级提示
            - 若已刷入 `v20261117.1` 或 `v20261117.2-rc.1` 模块，仅需直接覆盖安装新版 Manager APK（`2.24.27+195`）即可获得该 UI 修复，无需重刷模块或重启 Core。
          files: |
            releases/AdGuard_Home_gogogo_${{ env.VERSION_DATE }}.zip
            releases/AdGuardHomeManager.apk
            releases/SHA256SUMS.txt
