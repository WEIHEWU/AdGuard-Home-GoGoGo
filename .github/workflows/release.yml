name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unified Flashable Package
        run: |
          case "${GITHUB_REF_NAME:-}" in
            v*) VERSION_TAG="$GITHUB_REF_NAME" ;;
            *)  VERSION_TAG="v20261117.1" ;;
          esac
          VERSION_DATE="${VERSION_TAG#v}"
          case "$VERSION_TAG" in
            *-rc*|*beta*|*candidate*) IS_PRERELEASE="true"; MAKE_LATEST="false" ;;
            *)                       IS_PRERELEASE="false"; MAKE_LATEST="true" ;;
          esac
          chmod +x ./build.sh
          ./build.sh "$VERSION_DATE"
          cp -f module/AdGuardHomeManager.apk releases/AdGuardHomeManager.apk
          (
            cd releases
            sha256sum "AdGuard_Home_gogogo_${VERSION_DATE}.zip" "AdGuardHomeManager.apk" > SHA256SUMS.txt
            sha256sum "../module/bin/AdGuardHome" | sed 's|\.\./module/||' >> SHA256SUMS.txt
          )
          cat releases/SHA256SUMS.txt
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "VERSION_DATE=$VERSION_DATE" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "AdGuard Home GoGoGo ${{ env.VERSION_TAG }}"
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          body: |
            ### AdGuard Home GoGoGo `${{ env.VERSION_TAG }}`

            基于既有满血 DNS + SNI (`443`/`8443`) 双链架构（100% 保持全部过滤订阅、默认规则、DNS 上游与 SNI 检查范围不变），内置 **[AdGuard-Home-GoGoGo-Core v2026-11-16-rc.3](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Core)** 与 **[AdGuard-Home-GoGoGo-Manager v2.24.26](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Manager)**：

            > ⚠️ **验证与实机状态说明**：Core（Linux ARM64、`android_slim`、`race`/单元测试）、Manager 静态分析与 46 项单元/Widget/本地模拟 HTTP 回归测试、APK 签名及包体校验均已通过；本端环境未连接实机（`adb devices -l` 为空），完整实机端到端交互验收待实机检验。

            #### 主要包含特性
            - **模式切换及 Android `flock` 兼容修复**：父 Shell 统一初始化单调时钟记录各阶段耗时、消除重复配置校验，并在单次 `post_apply_check` 核对 `443`/`8443` NFQUEUE、`--queue-bypass` 与核心 `GID 23333` 豁免。
            - **调试日志开关与脱敏诊断包导出**：默认关闭且支持自动过期的模块详细调试日志（独立日志锁短事务轮转），配合管理器一键导出全链路脱敏诊断 ZIP（不含手动规则与备注隐私）并调用系统分享。
            - **实时误杀排错、SNI 记录及阻断聚合**：基于离线 PSL（ICANN + PRIVATE）实时检测 `A` / `AAAA` 规则命中，展示核心 `FilteredSNI` 与阻断摘要/同秒聚合。
            - **用户确认的分级放行与安全撤销**：由用户明确确认两级放行规则，写前排队 + `expected_revision` + 写后绑定 `X-User-Rules-Revision` 与核心实例 ID 防止跨客户端或重启误撤。
            - **手动规则来源、备注和集中管理**：严格绑定本端提交与回读版本；区分“历史来源（手动新增/用户认领）”与“当前关联（已确认/已不存在/待确认/重复歧义）”；支持“我的手动规则”页、实时核验与备份导出/校验导入。

            > ℹ️ **存储与关联说明**：手动来源记录和备注保存在管理器本地，正常升级及软重启应保持；卸载或清除应用数据可能丢失，请使用备份功能。核心重启或外部规则修改后，“当前关联”可能变为待确认，不代表规则被删除。
          files: |
            releases/AdGuard_Home_gogogo_${{ env.VERSION_DATE }}.zip
            releases/AdGuardHomeManager.apk
            releases/SHA256SUMS.txt
