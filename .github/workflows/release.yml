name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unified Flashable Package
        run: |
          case "${GITHUB_REF_NAME:-}" in
            v*) VERSION_TAG="$GITHUB_REF_NAME" ;;
            *)  VERSION_TAG="v20261116.2-rc.5" ;;
          esac
          VERSION_DATE="${VERSION_TAG#v}"
          case "$VERSION_TAG" in
            *-rc*|*beta*|*candidate*) IS_PRERELEASE="true"; MAKE_LATEST="false" ;;
            *)                       IS_PRERELEASE="false"; MAKE_LATEST="true" ;;
          esac
          chmod +x ./build.sh
          ./build.sh "$VERSION_DATE"
          cp -f module/AdGuardHomeManager.apk releases/AdGuardHomeManager.apk
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "VERSION_DATE=$VERSION_DATE" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "AdGuard Home GoGoGo ${{ env.VERSION_TAG }} (False-Positive Diagnostics & Debug Bundle Edition)"
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          body: |
            ### 🚀 AdGuard Home GoGoGo `${{ env.VERSION_TAG }}` (Candidate / Pre-release)

            基于既有满血 DNS + SNI (`443`/`8443`) 双链架构（100% 保持全部过滤订阅、默认规则、DNS 上游与 SNI 检查范围不变），集成 **[AdGuard-Home-GoGoGo-Core v2026-11-16-rc.3](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Core)** 与 **[AdGuard-Home-GoGoGo-Manager v2.24.26-rc.1](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Manager)**：

            > ⚠️ Candidate pre-release: Core race/unit/android_slim (Linux ARM64) tests unchanged at `v2026-11-16-rc.3`, Manager static analysis & 46 unit/widget/HTTP mock tests passed; real-device interactive testing on Android is pending.

            1. **🏷️ 手动规则来源精准绑定补修 (`Manager v2.24.26-rc.1`)**:
               - 提交绑定差异记录：所有来源录入仅计算“提交前 → 实际提交”差异并严格校对 `X-User-Rules-Revision` 与回读全量一致；若并发被打断，绝不把外部规则记为手动操作，明确提示被打断；
               - 区分“历史来源（手动新增 / 用户认领）”与“当前关联（已确认 / 已不存在 / 待确认 / 重复歧义）”：未观测外部变更、删除再重加、核心重启或重复行变化一律降为待确认或重复歧义，保留历史信息且绝不靠同文本自动绑定；
               - 备份导入严格校验枚举、禁止覆盖本地已有可信`已确认`记录，新导入默认`待确认`且绝不自证或创建 Core 规则。
            2. **🔍 Core + Manager 误杀排错、诊断包与切换计时 (`rc.2`/`rc.3`)**:
               - 继续完整保留既有核验撤销归属、离线 PSL、短事务轮转日志、脱敏诊断 ZIP 与单调切换计时，核心与默认规则均保持零改动。
          files: |
            releases/AdGuard_Home_gogogo_${{ env.VERSION_DATE }}.zip
            releases/AdGuardHomeManager.apk
