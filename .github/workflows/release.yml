name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unified Flashable Package
        run: |
          case "${GITHUB_REF_NAME:-}" in
            v*) VERSION_TAG="$GITHUB_REF_NAME" ;;
            *)  VERSION_TAG="v20261125.2" ;;
          esac
          VERSION_DATE="${VERSION_TAG#v}"
          case "$VERSION_TAG" in
            *-rc*|*beta*|*candidate*) IS_PRERELEASE="true"; MAKE_LATEST="false" ;;
            *)                       IS_PRERELEASE="false"; MAKE_LATEST="true" ;;
          esac
          chmod +x ./build.sh
          ./build.sh "$VERSION_DATE"
          cp -f module/AdGuardHomeManager.apk releases/AdGuardHomeManager.apk
          (
            cd releases
            sha256sum "AdGuard_Home_gogogo_${VERSION_DATE}.zip" "AdGuardHomeManager.apk" > SHA256SUMS.txt
            sha256sum "../module/bin/AdGuardHome" | sed 's|\.\./module/||' >> SHA256SUMS.txt
          )
          cat releases/SHA256SUMS.txt
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "VERSION_DATE=$VERSION_DATE" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "AdGuard Home GoGoGo ${{ env.VERSION_TAG }}"
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          body: |
            ### AdGuard Home GoGoGo `${{ env.VERSION_TAG }}`

            全设备级满血 DNS + SNI (`443/8443`) 双引擎去广告防火墙模块维护更新版，内置 **[AdGuard-Home-GoGoGo-Core v2026-11-25](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Core/releases/tag/v2026-11-25)**（无变动复用）与 **[AdGuard-Home-GoGoGo-Manager v2.24.30](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Manager/releases/tag/v2.24.30)**：

            - **Core (`v2026-11-25`)**: `12,320,892 B` · SHA-256 `d7b639ac111843afc5d6ed1e3cbf169c58f28740751909e4a6540aa4d9bdcda4`
            - **Manager (`v2.24.30+200`)**: `8,873,778 B` · SHA-256 `63994361c46e857c4321fca3cb002529debedbb37c60f084cb16ad9654b07663`

            #### 本次维护版更新（真机全 8 项诊断全绿通过）
            1. **阻断看门狗与操作锁的子进程 FD 继承 (`fd 7/8/9`)**：在 [service.sh](module/service.sh)、[iptables.sh](module/scripts/iptables.sh) 与 [switch_mode.sh](module/scripts/switch_mode.sh) 的 `safe_sleep()`、回退 `sleep 1` 及持锁期外部命令统一显式关闭 `7>&- 8>&- 9>&-`，消除 `sleep 60` 等子进程意外继承 `agh_watchdog.flock` / `agh_op.flock` 的隐患。
            2. **重构 `--diag-flock` `FD_LEAK_CHECK` 与放行 `mksh` 高位暂存 FD**：
               - 弃用进程名白名单，通过临时软链接实测 `-lname` 能力并显式优先采用 `/system/bin/find` / `/system/bin/toybox find`（主动避开不支持 `-lname` 的 BusyBox `find`），仅对命中的 PID 查询 `exe`/`cmdline`；极少数不支持 `-lname` 的 ROM 自动降级为单次 `ls -ln ... | awk` 兜底，绝不静默漏检；
               - 对确认身份的合法看门狗主进程（`role=watchdog` + `wd_pid_match=yes`）仅持有单个 `fd=8` 或 `mksh` 临时暂存高位描述符（`fd >= 10`）时准确放行判定 `WATCHDOG_LOCK_OK`，多 FD 或非看门狗进程一律严格报 `FD_LEAK_DETECTED`。
            3. **三脚本 `--diag-flock` 锁自检去重**：主脚本完成 3 步并发锁实测后向 `switch_mode.sh` / `iptables.sh` 透传已验证工具信息，工具路径与参数一致时免重复等待直接复用 `PASS`（不一致时补跑完整 3 步实测）。
            4. **Manager `04_lock_diagnostics.txt` 提速 (`Manager v2.24.30`)**：将逐个 FD `readlink` 重构为单次 `ls -ln /proc/$p/fd | grep -E 'agh_|flock'`，真机导出 8 项全部返回 `ok`（`partial_success: false`）。
          files: |
            releases/AdGuard_Home_gogogo_${{ env.VERSION_DATE }}.zip
            releases/AdGuardHomeManager.apk
            releases/SHA256SUMS.txt
