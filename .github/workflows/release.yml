name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unified Flashable Package
        run: |
          case "${GITHUB_REF_NAME:-}" in
            v*) VERSION_TAG="$GITHUB_REF_NAME" ;;
            *)  VERSION_TAG="v20261125.1" ;;
          esac
          VERSION_DATE="${VERSION_TAG#v}"
          case "$VERSION_TAG" in
            *-rc*|*beta*|*candidate*) IS_PRERELEASE="true"; MAKE_LATEST="false" ;;
            *)                       IS_PRERELEASE="false"; MAKE_LATEST="true" ;;
          esac
          chmod +x ./build.sh
          ./build.sh "$VERSION_DATE"
          cp -f module/AdGuardHomeManager.apk releases/AdGuardHomeManager.apk
          (
            cd releases
            sha256sum "AdGuard_Home_gogogo_${VERSION_DATE}.zip" "AdGuardHomeManager.apk" > SHA256SUMS.txt
            sha256sum "../module/bin/AdGuardHome" | sed 's|\.\./module/||' >> SHA256SUMS.txt
          )
          cat releases/SHA256SUMS.txt
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "VERSION_DATE=$VERSION_DATE" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "AdGuard Home GoGoGo ${{ env.VERSION_TAG }}"
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          body: |
            ### AdGuard Home GoGoGo `${{ env.VERSION_TAG }}`

            全设备级满血 DNS + SNI (`443/8443`) 双引擎去广告防火墙模块正式版，内置 **[AdGuard-Home-GoGoGo-Core v2026-11-25](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Core/releases/tag/v2026-11-25)** 与 **[AdGuard-Home-GoGoGo-Manager v2.24.29](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Manager/releases/tag/v2.24.29)**：

            - **Core (`v2026-11-25`)**: `12,320,892 B` · SHA-256 `d7b639ac111843afc5d6ed1e3cbf169c58f28740751909e4a6540aa4d9bdcda4`
            - **Manager (`v2.24.29+199`)**: `8,873,878 B` · SHA-256 `d30e2725483f3d2420259efaaf2b867c55a6f86e3e86f1bae784718d02ad5640`

            #### 本次正式版更新亮点
            1. **SNI 与核心稳定性加固 (`Core v2026-11-25`)**：
               - SNI `NFQUEUE`（`queue_num=0`）`queueReadTimeout` 调整为 `2s` 并启用 `1 MiB` `SO_RCVBUF` 与退避重连，大幅降低空闲唤醒并保证退出可控；区分可恢复 `ENOBUFS` 与真实断连、捕获 `handlePacket` panic、修复退出唤醒读写时序；
               - 修复规则定时更新与 `/control/filtering/refresh` 并发锁、`dialcontext`/Android `RootCAs` 与 DoH 上游回环路径、运行时 `core_crash.log` 512 KiB 有界轮转；
               - 彻底移除强制 `SetMemoryLimit` / `SetGCPercent` 人为上限，恢复 Go 官方默认 GC 与内存调度，避免高规则/大查询下的抖动。
            2. **软重启零抖动、高省电与 `--diag-flock` 修复 (`Module`)**：
               - `customize.sh` 覆盖刷入先幂等容错卸载旧链，零中断平滑升级并支持极速停进程与单向增量备份；
               - `service.sh --watchdog` 两级哨兵实测 1.5 小时仅约 2 秒 CPU：纯 Shell `/proc` 快速层、`is_system_ready_after_soft_reboot`（`sys.boot_completed` + `init.svc.zygote` + `system_server` PID 就绪门控 + 一次性防余震复检）、僵尸态 `State: Z/X` 精准剔除、`ADGUARD6_NAT` GID 与 `--connbytes 1:8` 双链完整性核验、以及按全仓 `/apex` + `/system` + `/data` 最大 mtime 构建 Conscrypt CA 包；
               - 修复 `service.sh --diag-flock` 子进程测试管道句柄未关闭与 `/proc` 全量 fork 阻塞问题，确保诊断包全 8 项采集快速完整返回 `ok`。
            3. **诊断包公共 `Download` 导出与本地时间命名 (`Manager v2.24.29`)**：
               - 诊断包默认同步保存至系统公共 `Download/agh_diag_YYYYMMDD_HHMMSS_xxxx.zip`（设备本地时间命名，同时在 manifest 保留 UTC 与带偏移本地时间），弹窗明确展示保存路径并保留系统分享入口；
               - 聚合日志点击详情内新增一键放行/拦截入口（保持日志列表行布局紧凑无改动），并全面加固 `su` 超时进程回收、`restoreFactoryUserRules` 失败防清空与端口同步。
          files: |
            releases/AdGuard_Home_gogogo_${{ env.VERSION_DATE }}.zip
            releases/AdGuardHomeManager.apk
            releases/SHA256SUMS.txt
