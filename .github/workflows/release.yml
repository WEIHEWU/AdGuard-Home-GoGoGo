name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unified Flashable Package
        run: |
          case "${GITHUB_REF_NAME:-}" in
            v*) VERSION_TAG="$GITHUB_REF_NAME" ;;
            *)  VERSION_TAG="v20261128.1" ;;
          esac
          VERSION_DATE="${VERSION_TAG#v}"
          case "$VERSION_TAG" in
            *-rc*|*beta*|*candidate*) IS_PRERELEASE="true"; MAKE_LATEST="false" ;;
            *)                       IS_PRERELEASE="false"; MAKE_LATEST="true" ;;
          esac
          chmod +x ./build.sh
          ./build.sh "$VERSION_DATE"
          cp -f module/AdGuardHomeManager.apk releases/AdGuardHomeManager.apk
          (
            cd releases
            sha256sum "AdGuard_Home_gogogo_${VERSION_DATE}.zip" "AdGuardHomeManager.apk" > SHA256SUMS.txt
            sha256sum "../module/bin/AdGuardHome" | sed 's|\.\./module/||' >> SHA256SUMS.txt
          )
          cat releases/SHA256SUMS.txt
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "VERSION_DATE=$VERSION_DATE" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "AdGuard Home GoGoGo ${{ env.VERSION_TAG }}"
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          body: |
            ### AdGuard Home GoGoGo `${{ env.VERSION_TAG }}`

            全设备级满血 DNS + SNI (`443/8443`) 双引擎去广告防火墙模块正式更新版，内置 **[AdGuard-Home-GoGoGo-Core v2026-11-28](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Core/releases/tag/v2026-11-28)**（`GOARM64=v8.0` 全芯片兼容 + 运行时 LSE 动态加速）与 **[AdGuard-Home-GoGoGo-Manager v2.24.30](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Manager/releases/tag/v2.24.30)**：

            - **Core (`v2026-11-28`)**: `12,386,428 B` · SHA-256 `2a6c5aa8f7c9f90d4870abf3e5fffc07afd5871fa0d1b31cc0a7351754693488`
            - **Manager (`v2.24.30+200`)**: `8,873,778 B` · SHA-256 `63994361c46e857c4321fca3cb002529debedbb37c60f084cb16ad9654b07663`

            #### 本次更新亮点
            1. **彻底修复 ARMv8.0 老芯片设备 Core `SIGILL`（退出码 `132`）崩溃**：Core 构建默认档位由 `GOARM64=v8.2` 调整为 `GOARM64=v8.0`（Go runtime 根据 CPU `hwcap` 在支持 LSE 的新设备自动启用 LSE 原子指令，在 ARMv8.0 设备自动回退 LL/SC，全系 64 位 Android 设备通用）。
            2. **补齐升级备份与安装期核心可执行冒烟校验（[customize.sh](module/customize.sh)）**：
               - 升级专属备份新增保存旧版 `bin/AdGuardHome`；
               - 解压暂存核心后立即 `chmod 0755` 并强制执行 `--version` / `--check-config` 校验（修复此前 `--version` 失败反而跳过校验直接覆盖的盲区），若新版在当前 CPU 无法运行且存在可用备份则自动回滚至旧版核心，全新安装失败则明确中止。
            3. **精简 `nsenter` 冗余探测与加固启动期错误可观测性（[service.sh](module/service.sh)、[switch_mode.sh](module/scripts/switch_mode.sh)）**：
               - 移除 `spawn_agh_in_root_ns` 与 `start_singleton_watchdog` 中多余的 `-u -i` 命名空间参数，优先使用 `-t 1 -m -n`，消除缺失 `/proc/1/ns/ipc` 内核上的无效探针与冗余 `fork`；
               - `ensure_agh_started` 启动前新增快速 `--version` 预检并记录 `rc` 与错误摘要至 `agh.log`（同时完整保留运行期 `--logfile discard` 零闪存写盘设计）。
          files: |
            releases/AdGuard_Home_gogogo_${{ env.VERSION_DATE }}.zip
            releases/AdGuardHomeManager.apk
            releases/SHA256SUMS.txt
